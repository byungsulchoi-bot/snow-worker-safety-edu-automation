  }
  return el("span", { class: "acts" },
    el("a", { class: "dl ghost", href: file.view, target: "_blank", rel: "noopener", text: "미리보기", "aria-label": file.filename + " 미리보기" }),
    el("a", { class: "dl", href: file.download, target: "_blank", rel: "noopener", text: "내려받기", "aria-label": file.filename + " 내려받기" }));
}

function render() {
  const Y = DATA.years.find((y) => y.year === current);
  $("posted").textContent = Y.posted_label;
  const st = $("status"); st.replaceChildren();
  const lawOk = !Y.law.changed && !Y.law.failed;
  const cells = [
    ["게시 기준일", Y.basis_date],
    ["법령 확인", el("span", { class: "pill " + (lawOk ? "ok" : "warn"), text: Y.law.failed ? "확인 실패 · 직전 기준" : Y.law.changed ? "개정 반영" : "변경 없음" })],
    ["정기교육 요구시간", "1인당 " + Y.required_hours + "시간 (" + Y.half + ")"],
    ["편성", Y.total_hours + "시간 · 8과목 · " + Y.instructor],
  ];
  for (const [k, v] of cells) st.append(el("div", {}, el("span", { class: "k", text: k }), el("span", { class: "v" }, v)));
  const ln = $("lawnotes"); ln.replaceChildren();
  ln.append(el("li", { text: Y.law_stamp }));
  for (const d of Y.law.details || []) ln.append(el("li", { text: d }));

  $("zipTitle").textContent = Y.year + "년 전체 패키지";
  $("zipMeta").textContent = Y.files.length + "개 파일 · " + kb(Y.zip.bytes) + " · 공문·양식·교안·체크리스트 포함";
  const zb = $("zipBtn");
  zb.href = Y.zip.download;
  if (DATA.mode === "site") { zb.setAttribute("download", Y.zip.filename); zb.removeAttribute("target"); }
  $("folderBtn").hidden = !Y.folder;
  if (Y.folder) $("folderBtn").href = Y.folder;
  $("driveNotice").hidden = DATA.mode === "site";

  const g = $("groups"); g.replaceChildren();
  for (const grp of DATA.groups) {
    const fs = Y.files.filter((f) => grp.prefixes.some((p) => f.filename.startsWith(p)));
    if (!fs.length) continue;
    const list = el("div", { class: "files" });
    for (const f of fs) {
      const ext = f.filename.split(".").pop().toUpperCase();
      const nm = f.filename.replace(/^\d\d_/, "").replace(/\.[^.]+$/, "").replace(/_/g, " ");
      list.append(el("div", { class: "file" },
        el("span", { class: "name" }, el("span", { class: "ext", text: ext }), nm, el("span", { class: "meta", text: kb(f.bytes) })),
        links(f)));
    }
    g.append(el("article", { class: "group" },
      el("div", { class: "group-head" }, el("span", { class: "num", text: grp.no }), el("h3", { text: grp.title })),
      grp.basis ? el("p", { class: "basis", text: "근거 " + grp.basis }) : null,
      list));
  }

  const rt = $("refTable"); rt.replaceChildren();
  rt.append(el("tr", {}, el("th", { text: "번호" }), el("th", { text: "정기교육 법정 교과목 (별표5)" }), el("th", { text: "편성" })));
  for (const s of Y.subjects) rt.append(el("tr", {}, el("td", { class: "n", text: s.no }), el("td", { text: s.name }), el("td", { class: "n", text: s.hours + "h" })));
  const et = $("exTable"); et.replaceChildren();
  et.append(el("tr", {}, el("th", { text: "구분" }), el("th", { text: "채용 시 교육(8시간) 면제·감면 조건" }), el("th", { text: "효과" }), el("th", { text: "근거" })));
  for (const e of Y.exemptions) et.append(el("tr", {}, el("td", { class: "n", text: e.id }), el("td", { text: e.condition }), el("td", { text: e.effect }), el("td", { class: "law", text: e.basis })));
  $("foot").textContent = "자동 생성: " + Y.generated_at + " · 판정과 서식은 검토용이며 최종 판단은 담당자가 입증서류로 확인합니다.";
}

function init() {
  const sel = $("year");
  for (const y of DATA.years) sel.append(el("option", { value: y.year, text: y.year + "년" + (y === DATA.years[0] ? " (최신)" : "") }));
  sel.value = current;
  sel.addEventListener("change", () => { current = Number(sel.value); render(); });
  render();
}
init();
</script>

</body>
</html>
